<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratorio de soluciones</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#eef3f1;--grid:#d5e0dc;--ink:#14302b;--card:#fbfdfc;--mut:#5b7570;--acc:#e8a317;--ok:#1e7a4c;--bad:#b3321f;--line:#b9cbc6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10201d;--grid:#1b2f2b;--ink:#e6f0ec;--card:#172a26;--mut:#93aca6;--ok:#5fd194;--bad:#ff8a76;--line:#2f4741;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10201d;--grid:#1b2f2b;--ink:#e6f0ec;--card:#172a26;--mut:#93aca6;--ok:#5fd194;--bad:#ff8a76;--line:#2f4741;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:17px;line-height:1.5;
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:24px 16px 56px}
h1{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:2rem;line-height:1.1;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{font:inherit;font-weight:600;padding:7px 14px;border:2px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);color:#14302b}
.bar{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px}
.track{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px}
.fill{height:100%;background:var(--ink);transition:width .3s}
.card{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:20px;box-shadow:5px 5px 0 var(--ink)}
.tag{display:inline-block;font-weight:600;color:var(--mut);margin-bottom:6px}
.q{font-size:1.1rem;margin:0 0 16px}
.row{display:flex;align-items:center;gap:10px;margin:10px 0;flex-wrap:wrap}
.row label{flex:1 1 180px;font-weight:600}
.row input{width:130px;font:inherit;font-size:1.1rem;padding:8px 10px;border:2px solid var(--ink);border-radius:4px;background:var(--bg);color:var(--ink)}
.row input.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--bg))}
.row input.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--bg))}
.u{color:var(--mut);min-width:40px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button.b{font:inherit;font-weight:600;padding:10px 18px;border-radius:4px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
button.b.alt{background:transparent;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.fb{margin-top:14px;font-weight:600}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.sol{margin-top:14px;padding:12px 14px;border-left:4px solid var(--acc);background:var(--bg);white-space:pre-line}
.end{text-align:center}
.big{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:3.4rem;line-height:1}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>Laboratorio de soluciones</h1>
<p class="sub">Resolvé el problema, escribí tu resultado y el juego te dice si está bien.</p>
<div class="chips" id="chips"></div>
<div id="game"></div>
</main>
<script>
const R=(a,b,s=1)=>Math.round((a+Math.random()*(b-a))/s)*s;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const f=(x,d=2)=>(+x.toFixed(d)).toString().replace('.',',');
const C=[{n:'cloruro de sodio',f:'NaCl',M:58.44},{n:'hidróxido de sodio',f:'NaOH',M:40.00},{n:'ácido sulfúrico',f:'H₂SO₄',M:98.08},{n:'glucosa',f:'C₆H₁₂O₆',M:180.16},{n:'ácido clorhídrico',f:'HCl',M:36.46},{n:'hidróxido de potasio',f:'KOH',M:56.11},{n:'hipoclorito de sodio',f:'NaClO',M:74.44}];
const TOPICS={pp:'% p/p',pv:'% p/v',vv:'% V/V',M:'Molaridad',m:'Molalidad'};
const G={
pp:[()=>{const c=pick(C),p=R(5,40),m=R(100,500,50),a=m*p/100;return{t:`Calculá los gramos de ${c.n} que hay que pesar para preparar ${m} g de disolución cuya concentración es ${p} % p/p.`,F:[['Masa de soluto','g',a]],s:`g soluto = ${m} g × ${p} / 100 = ${f(a)} g`}},
()=>{const c=pick(C),s=R(20,60,5),w=R(300,800,10),a=s/(s+w)*100;return{t:`Una solución contiene ${s} g de ${c.n} y ${w} g de agua. Calculá su concentración en % p/p.`,F:[['Concentración','% p/p',a]],s:`masa solución = ${s} + ${w} = ${s+w} g\n% p/p = ${s} / ${s+w} × 100 = ${f(a)} %`}},
()=>{const s=R(25,45,5),w=R(600,800,10),e=R(20,60,10),d=R(5,10),a=(s+d)/(s+w-e+d)*100;return{t:`Una solución de lavandina contiene ${s} g de hipoclorito de sodio y ${w} g de agua. Dos días después se evaporaron ${e} g de agua y se le adicionaron ${d} g del mismo soluto. Calculá la concentración final en % p/p.`,F:[['Concentración final','% p/p',a]],s:`soluto final = ${s} + ${d} = ${s+d} g\nagua final = ${w} − ${e} = ${w-e} g\nsolución final = ${s+d+w-e} g\n% p/p = ${s+d} / ${s+d+w-e} × 100 = ${f(a)} %`}},
()=>{const V=R(500,2000,100),p=R(10,35),d=R(105,125)/100,m=V*d,s=m*p/100;return{t:`${V} mL de solución acuosa de concentración ${p} % p/p poseen una densidad de ${f(d)} g/mL. ¿Qué masas de soluto y de solvente contienen?`,F:[['Masa de soluto','g',s],['Masa de solvente','g',m-s]],s:`masa solución = ${V} mL × ${f(d)} g/mL = ${f(m)} g\nsoluto = ${f(m)} × ${p} / 100 = ${f(s)} g\nsolvente = ${f(m)} − ${f(s)} = ${f(m-s)} g`}}],
pv:[()=>{const c=pick(C),p=R(10,35),d=R(105,125)/100,a=p*d;return{t:`Una solución de ${c.n} es ${p} % p/p y tiene una densidad de ${f(d)} g/mL. Calculá su concentración en % p/v.`,F:[['Concentración','% p/v',a]],s:`En 100 mL hay ${f(100*d)} g de solución\nsoluto = ${f(100*d)} × ${p} / 100 = ${f(a)} g\n% p/v = ${f(a)} g cada 100 mL = ${f(a)} %`}},()=>{const c=pick(C),p=R(2,20),V=R(100,1000,50),a=p*V/100;return{t:`¿Cuántos gramos de ${c.n} hay en ${V} mL de una solución ${p} % p/v?`,F:[['Masa de soluto','g',a]],s:`${p} % p/v = ${p} g cada 100 mL\ng = ${p} × ${V} / 100 = ${f(a)} g`}},
()=>{const g=R(5,60,5),V=R(100,500,50),a=g/V*100;return{t:`Se disuelven ${g} g de soluto en agua hasta completar ${V} mL de solución. Calculá su concentración en % p/v.`,F:[['Concentración','% p/v',a]],s:`% p/v = ${g} g / ${V} mL × 100 = ${f(a)} %`}},
()=>{const g=R(5,40,5),p=R(2,20),a=g*100/p;return{t:`¿Qué volumen de solución ${p} % p/v se puede preparar con ${g} g de soluto?`,F:[['Volumen','mL',a]],s:`${p} g de soluto por cada 100 mL\nV = ${g} × 100 / ${p} = ${f(a)} mL`}}],
vv:[()=>{const x=R(10,60,5),V=R(100,500,50),e=x/0.79,a=e/V*100;return{t:`Se mezclan ${x} g de etanol (densidad 0,79 g/mL) con agua hasta completar ${V} mL de solución. Calculá su concentración en % V/V.`,F:[['Concentración','% V/V',a]],s:`volumen de etanol = ${x} g / 0,79 g/mL = ${f(e)} mL\n% V/V = ${f(e)} / ${V} × 100 = ${f(a)} %`}},()=>{const p=R(5,40),V=R(100,1000,50),a=p*V/100;return{t:`¿Cuántos mL de alcohol hay en ${V} mL de una solución alcohólica ${p} % V/V?`,F:[['Volumen de soluto','mL',a]],s:`mL = ${p} × ${V} / 100 = ${f(a)} mL`}},
()=>{const x=R(5,50,5),V=R(100,500,50),a=x/V*100;return{t:`Se mezclan ${x} mL de etanol con agua hasta completar ${V} mL de solución. ¿Cuál es su concentración en % V/V?`,F:[['Concentración','% V/V',a]],s:`% V/V = ${x} / ${V} × 100 = ${f(a)} %`}},
()=>{const p=R(5,40),V=R(200,1000,50),a=p*V/100;return{t:`Se quiere preparar ${V} mL de una solución ${p} % V/V de acetona en agua. ¿Cuántos mL de acetona y cuántos mL de agua se necesitan? (Considerá los volúmenes aditivos).`,F:[['Acetona','mL',a],['Agua','mL',V-a]],s:`acetona = ${p} × ${V} / 100 = ${f(a)} mL\nagua = ${V} − ${f(a)} = ${f(V-a)} mL`}}],
M:[()=>{const c=pick(C),g=R(5,60,5),V=R(250,1500,250)/1000,a=g/c.M/V;return{t:`Se disuelven ${g} g de ${c.n} (${c.f}, Mr = ${f(c.M)} g/mol) en agua hasta completar ${f(V,2)} L de solución. Calculá la molaridad.`,F:[['Molaridad','M',a]],s:`moles = ${g} / ${f(c.M)} = ${f(g/c.M,4)} mol\nM = ${f(g/c.M,4)} mol / ${f(V,2)} L = ${f(a)} M`}},
()=>{const c=pick(C),M=R(1,20)/10,V=R(100,1000,50),a=M*V/1000*c.M;return{t:`¿Cuántos gramos de ${c.n} (${c.f}, Mr = ${f(c.M)} g/mol) hacen falta para preparar ${V} mL de solución ${f(M,1)} M?`,F:[['Masa de soluto','g',a]],s:`moles = ${f(M,1)} M × ${f(V/1000,3)} L = ${f(M*V/1000,4)} mol\ng = ${f(M*V/1000,4)} × ${f(c.M)} = ${f(a)} g`}},
()=>{const c=pick(C.filter(x=>['HCl','H₂SO₄','NaOH','KOH'].includes(x.f))),p=R(10,40),d=R(105,135)/100,a=10*p*d/c.M;return{t:`Una solución de ${c.n} (${c.f}, Mr = ${f(c.M)} g/mol) es ${p} % p/p y tiene densidad ${f(d)} g/mL. Calculá su molaridad.`,F:[['Molaridad','M',a]],s:`En 1000 mL hay ${f(1000*d)} g de solución\nsoluto = ${f(1000*d)} × ${p} / 100 = ${f(10*p*d)} g\nM = ${f(10*p*d)} / ${f(c.M)} = ${f(a)} M`}},
()=>{const g=R(20,60,2),w=R(500,900,50),d=R(105,140)/100,V=(g+w)/d/1000,a=g/98.08/V;return{t:`${g} g de ácido sulfúrico (H₂SO₄, Mr = 98,08 g/mol) se mezclan con ${w} g de agua para formar una solución. Si la densidad de la solución es ${f(d)} g/mL, calculá su molaridad.`,F:[['Molaridad','M',a]],s:`masa solución = ${g+w} g\nvolumen = ${g+w} / ${f(d)} = ${f(V*1000,1)} mL = ${f(V,4)} L\nmoles = ${g} / 98,08 = ${f(g/98.08,4)} mol\nM = ${f(g/98.08,4)} / ${f(V,4)} = ${f(a)} M`}}],
m:[()=>{const c=pick(C.filter(x=>['HCl','H₂SO₄','NaOH','KOH'].includes(x.f))),M=R(10,40)/10,d=R(105,130)/100,s=M*c.M,w=1000*d-s,a=M/(w/1000);return{t:`Una solución de ${c.n} (${c.f}, Mr = ${f(c.M)} g/mol) ${f(M,1)} M tiene una densidad de ${f(d)} g/mL. Calculá su molalidad.`,F:[['Molalidad','m',a]],s:`En 1 L de solución: masa = ${f(1000*d)} g\nsoluto = ${f(M,1)} × ${f(c.M)} = ${f(s)} g\nsolvente = ${f(1000*d)} − ${f(s)} = ${f(w)} g = ${f(w/1000,4)} kg\nm = ${f(M,1)} mol / ${f(w/1000,4)} kg = ${f(a)} m`}},()=>{const c=pick(C),g=R(5,60,5),w=R(200,1000,50),a=g/c.M/(w/1000);return{t:`Se disuelven ${g} g de ${c.n} (${c.f}, Mr = ${f(c.M)} g/mol) en ${w} g de agua. Calculá la molalidad.`,F:[['Molalidad','m',a]],s:`moles = ${g} / ${f(c.M)} = ${f(g/c.M,4)} mol\nm = ${f(g/c.M,4)} mol / ${f(w/1000,3)} kg = ${f(a)} m`}},
()=>{const c=pick(C),m=R(1,20)/10,w=R(200,1000,50),a=m*w/1000*c.M;return{t:`¿Cuántos gramos de ${c.n} (${c.f}, Mr = ${f(c.M)} g/mol) hay que disolver en ${w} g de agua para obtener una solución ${f(m,1)} m?`,F:[['Masa de soluto','g',a]],s:`moles = ${f(m,1)} m × ${f(w/1000,3)} kg = ${f(m*w/1000,4)} mol\ng = ${f(m*w/1000,4)} × ${f(c.M)} = ${f(a)} g`}},

()=>{const c=pick(C),p=R(10,40),a=(p/c.M)/((100-p)/1000);return{t:`Una solución de ${c.n} (${c.f}, Mr = ${f(c.M)} g/mol) es ${p} % p/p. Calculá su molalidad.`,F:[['Molalidad','m',a]],s:`En 100 g de solución: ${p} g de soluto y ${100-p} g de solvente\nmoles = ${p} / ${f(c.M)} = ${f(p/c.M,4)} mol\nm = ${f(p/c.M,4)} / ${f((100-p)/1000,3)} kg = ${f(a)} m`}}]
};
let sel=new Set(Object.keys(TOPICS)),N=10,st;
const $=id=>document.getElementById(id);
function chips(){$('chips').innerHTML='';for(const k in TOPICS){const b=document.createElement('button');b.className='chip';b.textContent=TOPICS[k];b.setAttribute('aria-pressed',sel.has(k));b.onclick=()=>{if(sel.has(k)){if(sel.size>1)sel.delete(k)}else sel.add(k);chips();start()};$('chips').appendChild(b)}}
function start(){st={i:0,score:0,done:false};next()}
function next(){if(st.i>=N)return end();const wantD=Math.random()<0.5;let k,q,n=0;do{k=pick([...sel]);q=pick(G[k])();n++}while(wantD&&!/densidad/.test(q.t)&&n<80);q.k=k;st.q=q;st.tries=0;st.solved=false;render()}
function render(){const q=st.q;
$('game').innerHTML=`<div class="bar"><span>Pregunta ${st.i+1} de ${N}</span><span>Puntaje: ${st.score}</span></div><div class="track"><div class="fill" style="width:${st.i/N*100}%"></div></div>
<div class="card"><span class="tag">${TOPICS[q.k]}</span><p class="q">${q.t}</p>
${q.F.map((x,i)=>`<div class="row"><label for="a${i}">${x[0]}</label><input id="a${i}" inputmode="decimal" autocomplete="off"><span class="u">${x[1]}</span></div>`).join('')}
<div class="btns"><button class="b" id="chk">Comprobar</button><button class="b alt hide" id="show">Ver resolución</button><button class="b hide" id="nx">Siguiente</button></div>
<div id="fb" class="fb" role="status"></div><div id="sol" class="sol hide"></div></div>`;
$('chk').onclick=check;$('show').onclick=showSol;$('nx').onclick=()=>{st.i++;next()};
document.querySelectorAll('.row input').forEach(e=>e.onkeydown=ev=>{if(ev.key==='Enter')st.solved?$('nx').click():check()});$('a0').focus()}
function check(){const q=st.q;let all=true,empty=false;
q.F.forEach((x,i)=>{const e=$('a'+i),v=parseFloat(e.value.replace(',','.'));if(isNaN(v)){empty=true;return}
const ok=Math.abs(v-x[2])<=Math.max(0.015*Math.abs(x[2]),0.011);e.className=ok?'ok':'bad';if(!ok)all=false});
if(empty){$('fb').className='fb bad';$('fb').textContent='Completá todos los campos con números.';return}
st.tries++;const fb=$('fb');
if(all){fb.className='fb ok';fb.textContent=st.tries===1?'¡Está bien! +1 punto':'Ahora sí, está bien.';if(st.tries===1)st.score++;st.solved=true;$('chk').classList.add('hide');$('nx').classList.remove('hide');$('show').classList.remove('hide');$('nx').focus()}
else{fb.className='fb bad';fb.textContent='No está bien. Revisá el cálculo y probá de nuevo.';$('show').classList.remove('hide')}}
function showSol(){const s=$('sol');s.classList.remove('hide');s.textContent=st.q.s+'\n\nRespuesta: '+st.q.F.map(x=>`${f(x[2])} ${x[1]}`).join('  |  ');st.solved=true;$('nx').classList.remove('hide');$('show').classList.add('hide')}
function end(){const p=st.score/N;$('game').innerHTML=`<div class="card end"><span class="tag">Ronda terminada</span><div class="big">${st.score}/${N}</div><p>${p>=.9?'Excelente, dominás el tema.':p>=.6?'Muy bien, un poco más de práctica y sale perfecto.':'Repasá las fórmulas y volvé a intentar.'}</p><div class="btns" style="justify-content:center"><button class="b" id="again">Jugar otra ronda</button></div></div>`;$('again').onclick=start}
chips();start();
</script>
</body>
</html>
